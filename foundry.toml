[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# FFI lets the deploy scripts shell out to Node: to generate and pin the demo tokens' avatars to
# IPFS (`_pinAvatar`, local only), and to mine the vanity salt that gives BODKIN and the demo coins
# the same `b0d41` address suffix every launch from the site gets — a million-keccak search is not
# viable in Solidity. The production deploy can skip the miner by pinning BODKIN_SALT instead.
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]
# v4-core ships tests we don't want to compile; keep our build to src + our tests.
# Never let a stale Claude Code worktree (contracts/.claude/worktrees/*, which carry
# their own node_modules with unrelated Uniswap V2 contracts) get swept into the build.
skip = ["**/.claude/**"]

# Robinhood Chain deploy endpoints — used as `forge script --rpc-url robinhood_{testnet,mainnet}`
# (see script/DeployV1.s.sol + bin/deploy.sh). The URLs are read from .env, which forge loads
# automatically; an unset var is only an error if that endpoint is actually selected, so this
# never affects `forge test`/`forge build`.
[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
robinhood_mainnet = "${ROBINHOOD_MAINNET_RPC_URL}"

